name: CI/CD - Automatización de Pruebas Spring Boot

on:
  push:
    branches: [ master ]  # Se ejecuta al hacer push a la rama master

jobs:
  build:
    name: Compilar Proyecto
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'

      - name: Configurar Gradle
        uses: gradle/gradle-build-action@v3

      - name: Compilar aplicación Spring Boot
        run: gradle clean build

      - name: Guardar artefactos compilados
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/

  docker:
    name: Construir y subir imagen Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Clonar el código fuente
        uses: actions/checkout@v4

      - name: Descargar artefactos compilados
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/

      - name: Configurar Docker
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Construir imagen Docker
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/automation-test:latest .

      - name: Subir imagen a Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/automation-test:latest